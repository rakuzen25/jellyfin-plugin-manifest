name: Validate catalog
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: catalog-validate-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}
jobs:
  catalog-validate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'catalog-metadata-event' || 'catalog-validate' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@72d140f19049afcc3a3fc6a7b759867707200cf6 # v0.6.1
        with:
          project-directory: .
          mode: development
      - name: Install pinned GitHub CLI
        run: uv run --no-sync python scripts/tools.py install-gh --directory "$RUNNER_TEMP/catalog-tools"
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@72d140f19049afcc3a3fc6a7b759867707200cf6 # v0.6.1
        with:
          project-directory: .
      - run: uv run --no-sync jpt prepare
      - name: Check formatting and lint
        run: pnpm check
      - run: pnpm test
      - name: Select fresh advisory execution
        id: audit
        run: uv run --no-sync jpt internal audit-selection
      - name: Audit dependency advisories
        if: steps.audit.outputs.required == 'true'
        run: uv run --no-sync jpt test advisories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.audit.outputs.required == 'true'
        with:
          name: manifest-advisories
          path: dist/evidence/advisories.json
          if-no-files-found: warn
      - name: Verify catalog and public release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: uv run --no-sync python scripts/catalog_sync.py validate
