name: Dependency advisories
on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@ca81ee6d897b724f1ad098317de9dabdd9d4a92a # v0.6.4
        with:
          project-directory: .
          mode: development
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@ca81ee6d897b724f1ad098317de9dabdd9d4a92a # v0.6.4
        with:
          project-directory: .
          install: "false"
      - run: uv run --no-sync jpt test advisories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: manifest-advisories
          path: dist/evidence/advisories.json
          if-no-files-found: warn
