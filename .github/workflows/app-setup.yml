name: Set up connected GitHub App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/setup-automation.yml@ca81ee6d897b724f1ad098317de9dabdd9d4a92a # v0.6.4
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
      retry_closed: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
