name: Reconcile plugin catalog
on:
  repository_dispatch:
    types: [plugin-published]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - name: Install pinned GitHub CLI
        run: uv run --no-sync python scripts/tools.py install-gh --directory "$RUNNER_TEMP/catalog-tools"
      - name: Create read-only source token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: source
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          owner: rakuzen25
          repositories: |
            jellyfin-plugin-lyricbridge
            jellyfin-plugin-music-metadata-manager
            jellyfin-plugin-toolkit
          permission-contents: read
          permission-actions: read
          permission-attestations: read
      - name: Reconcile all allowlisted releases (dispatch payload is only a hint)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_GH_TOKEN: ${{ steps.source.outputs.token }}
          PLUGIN_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: uv run --no-sync python scripts/catalog_sync.py sync
