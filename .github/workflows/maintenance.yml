name: Withdraw or restore version
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Catalog operation
        type: choice
        options: [Withdraw, Restore]
        required: true
      repository:
        description: Allowlisted owner/repository
        type: string
        default: rakuzen25/jellyfin-plugin-lyricbridge
        required: true
      version:
        description: Exact catalog version (for example 0.1.3.0)
        type: string
        required: true
      reason:
        description: Reason recorded in the PR audit trail
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: catalog-update
  cancel-in-progress: false
  queue: max
jobs:
  maintenance:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Require the catalog main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@72d140f19049afcc3a3fc6a7b759867707200cf6 # v0.6.1
        id: app
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@72d140f19049afcc3a3fc6a7b759867707200cf6 # v0.6.1
        with:
          project-directory: .
          mode: runtime
      - name: Install pinned GitHub CLI
        run: uv run --no-sync python scripts/tools.py install-gh --directory "$RUNNER_TEMP/catalog-tools"
      - name: Create read-only source verification token
        continue-on-error: true
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@72d140f19049afcc3a3fc6a7b759867707200cf6 # v0.6.1
        id: source
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          owner: rakuzen25
          repositories: |
            jellyfin-plugin-lyricbridge
            jellyfin-plugin-music-metadata-manager
            jellyfin-plugin-toolkit
          permission-contents: read
          permission-actions: read
          permission-attestations: read
      - name: Propose explicit maintenance
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_GH_TOKEN: ${{ steps.source.outputs.token }}
          PLUGIN_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REQUEST_OPERATION: ${{ inputs.operation }}
          REQUEST_REPOSITORY: ${{ inputs.repository }}
          REQUEST_VERSION: ${{ inputs.version }}
          REQUEST_REASON: ${{ inputs.reason }}
        run: >-
          uv run --no-sync python scripts/catalog_maintenance.py
          --operation "$REQUEST_OPERATION" --repository "$REQUEST_REPOSITORY"
          --version "$REQUEST_VERSION" --reason "$REQUEST_REASON"
      - name: Audit remaining catalog integrity without blocking maintenance
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.source.outputs.token }}
        run: uv run --no-sync python scripts/catalog_sync.py validate
      - name: Report unrelated integrity warning
        if: steps.audit.outcome == 'failure'
        run: echo 'Remaining catalog integrity checks failed; maintenance is not blocked. Review the audit log and scheduled reconciliation issue.' >> "$GITHUB_STEP_SUMMARY"
