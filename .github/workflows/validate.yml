name: Validate catalog
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: catalog-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  catalog-validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\)]+\))?!?:\ .+ ]]; then
            echo 'Use a Conventional Commit title, for example: fix(catalog): verify release metadata'
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-check.txt
      - name: Install Python check dependencies
        run: python3 -m pip install -r requirements-check.txt
      - name: Check Python formatting and lint
        run: |
          python3 -m ruff format --check scripts tests
          python3 -m ruff check scripts tests
      - run: python3 -m unittest discover -s tests -p 'Catalog*.py'
      - name: Verify catalog and public release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/catalog_sync.py validate
