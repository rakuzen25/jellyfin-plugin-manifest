name: Set up connected GitHub App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/setup-automation.yml@d199cb44534bee72936ae2a007b0c0eda82131d1 # v0.5.3
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
      retry_closed: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
