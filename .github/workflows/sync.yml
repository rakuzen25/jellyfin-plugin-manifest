name: Reconcile plugin catalog
on:
  repository_dispatch:
    types: [plugin-published]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@b2e9575af98d8d08c4514b8de82a61b2f16c5b75 # v0.6.3
        id: app
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@b2e9575af98d8d08c4514b8de82a61b2f16c5b75 # v0.6.3
        with:
          project-directory: .
          mode: runtime
      - name: Install pinned GitHub CLI
        run: uv run --no-sync python scripts/tools.py install-gh --directory "$RUNNER_TEMP/catalog-tools"
      - name: Create read-only source token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@b2e9575af98d8d08c4514b8de82a61b2f16c5b75 # v0.6.3
        id: source
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          owner: rakuzen25
          repositories: |
            jellyfin-plugin-lyricbridge
            jellyfin-plugin-music-metadata-manager
            jellyfin-plugin-toolkit
          permission-contents: read
          permission-actions: read
          permission-attestations: read
      - name: Reconcile all allowlisted releases (dispatch payload is only a hint)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_GH_TOKEN: ${{ steps.source.outputs.token }}
          PLUGIN_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: uv run --no-sync python scripts/catalog_sync.py sync
