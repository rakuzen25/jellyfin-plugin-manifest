[project]
name = "jellyfin-plugin-manifest"
version = "0.0.0"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "ruff==0.17.2",
]

[tool.uv]
package = false
required-version = "==0.13.4"
python-preference = "only-system"

[tool.ruff]
target-version = "py315"
include = ["scripts/**/*.py", "tests/**/*.py"]

[tool.mypy]
python_version = "3.15"
files = ["scripts", "tests"]
strict = true
