name: Validate catalog
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: catalog-validate-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}
jobs:
  catalog-validate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'catalog-metadata-event' || 'catalog-validate' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Install pinned GitHub CLI
        run: uv run --no-sync python scripts/tools.py install-gh --directory "$RUNNER_TEMP/catalog-tools"
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v5
        with:
          install: false
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: uv run --no-sync jpt prepare
      - name: Check formatting and lint
        run: pnpm check
      - run: pnpm test
      - name: Audit dependency advisories
        run: uv run --no-sync jpt test advisories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: manifest-advisories
          path: dist/evidence/advisories.json
          if-no-files-found: warn
      - name: Test Renovate dependency extraction
        run: uv run --no-sync python scripts/tools.py test-renovate
      - name: Verify catalog and public release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: uv run --no-sync python scripts/catalog_sync.py validate
