name: Set up connected GitHub App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/setup-automation.yml@b2e9575af98d8d08c4514b8de82a61b2f16c5b75 # v0.6.3
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
      retry_closed: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
