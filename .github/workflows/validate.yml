name: Validate catalog
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: catalog-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  catalog-validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\)]+\))?!?:\ .+ ]]; then
            echo 'Use a Conventional Commit title, for example: fix(catalog): verify release metadata'
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-check.txt
      - name: Install Python check dependencies
        run: python3 -m pip install -r requirements-check.txt
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v5
        with:
          install: false
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm check
      - run: python3 -m unittest discover -s tests -p 'Catalog*.py'
      - name: Verify catalog and public release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/catalog_sync.py validate
